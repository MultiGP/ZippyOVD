<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZippyOVD Admin</title>
    <link rel="stylesheet" href="/static/race/css/style.css" />
</head>
<body>
    <main class="container">
        <h1>ZippyOVD Admin</h1>

        <section class="card">
            <h2>Velocidrone Host</h2>
            <div class="row">
                <input id="machineIp" type="text" placeholder="e.g. 192.168.1.50" />
                <button id="saveIp">Save IP</button>
            </div>
            <p id="ipStatus" class="muted"></p>
            <p id="wsStatus" class="muted"></p>
        </section>

        <section class="card">
            <h2>Race Controls</h2>
            <div class="row wrap">
                <button data-action="start_race">Start Race</button>
                <button data-action="abort_race">Abort Race</button>
                <button data-action="all_spectate">All Spectate</button>
            </div>
        </section>

        <section class="card">
            <h2>Camera Actions</h2>
            <div class="row wrap">
                <button data-action="camera_spectate">Camera Spectate</button>
                <button data-action="camera_fpv">Camera FPV</button>
                <button data-action="camera_reset">Camera Reset</button>
            </div>
            <div class="row top-gap">
                <select id="pilotUid"></select>
                <button data-action="camera_player">Camera Player</button>
            </div>
            <div class="row top-gap">
                <input id="cameraNumber" type="number" placeholder="Camera #" />
                <button data-action="camera_select">Camera Select</button>
            </div>
        </section>

        <section class="card">
            <h2>Race Bug</h2>
            <div class="stack">
                <a href="/race/bug/" target="_blank">Open Race Bug Page</a>
                <a href="/race/bug/?compact=1" target="_blank">Open Compact Overlay Mode</a>
            </div>
        </section>

        <p id="actionStatus"></p>
    </main>

    <script src="/static/race/js/admin.js"></script>
</body>
</html>
