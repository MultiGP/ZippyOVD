<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZippyOVD Race Bug</title>
    <link rel="stylesheet" href="/static/race/css/style.css" />
</head>
<body class="bug-page{% if compact %} compact{% endif %}">
    <main class="container">
        <h1>Race Bug</h1>

        <section class="card" id="overlayOptions">
            <h2>Overlay Options</h2>
            <div class="row">
                <label for="teamMode">Team Score Mode</label>
                <select id="teamMode">
                    <option value="sum">Sum of current laps</option>
                    <option value="completed">Completed lap increments</option>
                </select>
            </div>
        </section>

        <section class="card">
            <h2>Players</h2>
            <div id="players" class="stack"></div>
        </section>

        <section class="card">
            <h2>Team Scores</h2>
            <div id="teams" class="stack"></div>
        </section>

        <p id="wsState" class="muted"></p>
    </main>

    <script src="/static/race/js/race_bug.js"></script>
</body>
</html>
